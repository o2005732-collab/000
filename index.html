<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DutyControl Pro — Система Чергувань</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            --panel-bg: rgba(255, 255, 255, 0.85);
            --border-color: rgba(15, 23, 42, 0.08);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent-primary: #4f46e5;
            --accent-glow: rgba(79, 70, 229, 0.15);
            --critical-day: #ef4444;
            --success: #10b981;
            
            /* Кольори для статусів (Світла тема) */
            --day-duty-bg: rgba(79, 70, 229, 0.08);
            --day-duty-border: rgba(79, 70, 229, 0.3);
            --day-work-bg: rgba(16, 185, 129, 0.08);
            --day-work-border: rgba(16, 185, 129, 0.3);
            --day-vacation-bg: rgba(14, 165, 233, 0.08);
            --day-vacation-border: rgba(14, 165, 233, 0.3);
            --day-trip-bg: rgba(168, 85, 247, 0.08);
            --day-trip-border: rgba(168, 85, 247, 0.3);
            --day-sick-bg: rgba(f5, 158, 11, 0.08);
            --day-sick-border: rgba(245, 158, 11, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1750px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 500px;
            gap: 2rem;
        }

        @media (max-width: 1400px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            padding: 1.2rem 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        .logo-area h1 {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #1e293b;
        }

        .logo-area span {
            color: var(--accent-primary);
        }

        .month-selector {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .btn {
            background: #ffffff;
            border: 1px solid rgba(15, 23, 42, 0.12);
            color: #1e293b;
            padding: 0.6rem 1.2rem;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .btn:hover {
            border-color: var(--accent-primary);
            background: rgba(79, 70, 229, 0.04);
        }

        .current-month-title {
            font-size: 1.15rem;
            font-weight: 700;
            min-width: 160px;
            text-align: center;
            color: #1e293b;
        }

        /* ПАНЕЛЬ ШВИДКОГО ЗАПОВНЕННЯ */
        .quick-fill-panel {
            grid-column: 1 / -1;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 1rem 1.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .quick-fill-title {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }

        .brush-badge {
            background: #fff;
            border: 1px solid rgba(15, 23, 42, 0.1);
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .brush-badge:hover {
            border-color: var(--accent-primary);
            background: rgba(79, 70, 229, 0.04);
        }

        .brush-badge.active {
            background: var(--accent-primary);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
        }

        /* КАЛЕНДАР */
        .main-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 1.5rem;
            box-shadow: 0 15px 30px -10px rgba(0, 0, 0, 0.05);
        }

        .weekdays-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            text-align: center;
            margin-bottom: 0.75rem;
        }

        .weekday-label {
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 700;
            padding: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
        }

        .calendar-day {
            background: #ffffff;
            border: 1px solid rgba(15, 23, 42, 0.06);
            border-radius: 14px;
            min-height: 135px;
            padding: 0.65rem;
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: all 0.2s ease;
            position: relative;
        }

        .calendar-day:not(.empty) {
            cursor: pointer;
        }

        .calendar-day:not(.empty):hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px -6px rgba(0, 0, 0, 0.08);
            border-color: rgba(15, 23, 42, 0.15);
        }

        .calendar-day.empty {
            background: transparent;
            border: none;
            pointer-events: none;
        }

        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .day-number {
            font-size: 1rem;
            font-weight: 700;
            color: #475569;
        }

        /* Підсвічування критичних днів */
        .calendar-day.critical-day {
            background: #fffafb;
            border-color: rgba(239, 68, 68, 0.1);
        }
        
        .calendar-day.critical-day .day-number {
            color: var(--critical-day);
        }

        /* Стилі для статусів дня */
        .day-duty { border-color: var(--day-duty-border); background: var(--day-duty-bg) !important; }
        .day-work { border-color: var(--day-work-border); background: var(--day-work-bg) !important; }
        .day-vacation { border-color: var(--day-vacation-border); background: var(--day-vacation-bg) !important; }
        .day-trip { border-color: var(--day-trip-border); background: var(--day-trip-bg) !important; }
        .day-sick { border-color: var(--day-sick-border); background: var(--day-sick-bg) !important; }

        .employee-select, .type-select {
            width: 100%;
            background: #ffffff;
            border: 1px solid rgba(15, 23, 42, 0.12);
            color: var(--text-main);
            padding: 0.35rem;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 500;
            cursor: pointer;
            outline: none;
            transition: all 0.15s ease;
        }

        .employee-select:focus, .type-select:focus {
            border-color: var(--accent-primary);
        }

        /* АНАЛІТИКА */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .stats-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 1.5rem;
            box-shadow: 0 15px 30px -10px rgba(0, 0, 0, 0.05);
        }

        .stats-panel h2 {
            font-size: 1.2rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 1.2rem;
        }

        .stats-list {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            max-height: 650px;
            overflow-y: auto;
            padding-right: 0.25rem;
        }

        .stats-list::-webkit-scrollbar {
            width: 4px;
        }
        .stats-list::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }

        .stat-card {
            background: #ffffff;
            border: 1px solid rgba(15, 23, 42, 0.06);
            border-radius: 12px;
            padding: 0.75rem 0.85rem;
            display: grid;
            grid-template-columns: 140px repeat(4, 1fr);
            gap: 0.5rem;
            align-items: center;
            position: relative;
        }

        .load-indicator {
            position: absolute;
            left: 4px;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 20px;
            border-radius: 4px;
        }
        .load-low { background: #10b981; }
        .load-medium { background: #f59e0b; }
        .load-high { background: #ef4444; }

        .stat-name {
            font-weight: 600;
            font-size: 0.85rem;
            color: #334155;
            padding-left: 6px;
        }

        .badge {
            padding: 0.3rem 0.1rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            text-align: center;
        }

        .badge-total { background: rgba(79, 70, 229, 0.06); color: #4f46e5; border: 1px solid rgba(79, 70, 229, 0.15); }
        .badge-critical { background: rgba(239, 68, 68, 0.06); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.15); }
        .badge-work { background: rgba(16, 185, 129, 0.06); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.15); }
        .badge-other { background: rgba(100, 116, 139, 0.06); color: #64748b; border: 1px solid rgba(100, 116, 139, 0.15); }

        .sync-banner {
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.05) 0%, rgba(16, 185, 129, 0.05) 100%);
            border: 1px solid rgba(79, 70, 229, 0.15);
            border-radius: 16px;
            padding: 1rem;
            font-size: 0.85rem;
            line-height: 1.4;
            color: #475569;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo-area">
            <h1>DutyControl <span>Pro</span></h1>
        </div>
        <div class="month-selector">
            <button class="btn" onclick="changeMonth(-1)">◀</button>
            <div class="current-month-title" id="monthTitle">Липень 2026</div>
            <button class="btn" onclick="changeMonth(1)">▶</button>
        </div>
        <div>
            <button class="btn" style="border-color: var(--success); color: var(--success); background: rgba(16, 185, 129, 0.04);" onclick="saveToCloudAndLocal()">Зберегти зміни</button>
        </div>
    </header>

    <!-- ПАНЕЛЬ ШВИДКОГО ПЕНЗЛИКА -->
    <div class="quick-fill-panel">
        <span class="quick-fill-title">🖌️ Швидкий пензлик:</span>
        <button class="brush-badge" id="btnBrushNone" onclick="selectBrush('')" style="font-weight: bold; border-color: #ef4444; color: #ef4444;">Вимкнути пензлик</button>
        <div id="brushContainer" style="display: flex; gap: 0.5rem; flex-wrap: wrap;"></div>
    </div>

    <main class="main-panel">
        <div class="weekdays-grid">
            <div class="weekday-label">Пн</div>
            <div class="weekday-label">Вт</div>
            <div class="weekday-label">Ср</div>
            <div class="weekday-label">Чт</div>
            <div class="weekday-label">Пт</div>
            <div class="weekday-label">Сб</div>
            <div class="weekday-label">Нд</div>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
    </main>

    <aside class="sidebar">
        <div class="stats-panel">
            <h2>Аналітика нарядів та статусів</h2>
            <div style="display: grid; grid-template-columns: 140px repeat(4, 1fr); gap: 0.5rem; padding: 0 0.5rem 0.5rem 0.5rem; color: var(--text-muted); font-size: 0.65rem; font-weight: bold; text-align: center; text-transform: uppercase;">
                <span style="text-align: left; padding-left: 6px;">Працівник</span>
                <span>Черг.</span>
                <span>Чт-Нд</span>
                <span>Відпр.</span>
                <span>Інше</span>
            </div>
            <div class="stats-list" id="statsList"></div>
        </div>

        <div class="sync-banner">
            <strong>⚙️ Розумний захист активований:</strong><br>
            • Система автоматично блокує призначення "доба через добу".<br>
            • Співробітники у відпустці або на лікарняному приховуються зі списків.
        </div>
    </aside>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzhu3m5MazbR5CY6KkgqCRlpxTaVih_RIaystRhpTOIRPbsqJQk8cw6ARNiSub3T2xB/exec";

    // 13 Працівників
    const employees = [
        "Дем'яненко Т.І.",
        "Цибко В.І.",
        "Ївженко В.О.",
        "Щербатюк М.В.",
        "Магера В.В.",
        "Муха М.О.",
        "Дробіт О.Ю.",
        "Онищенко Р.В.",
        "Романов В.М.",
        "Магера А.В.",
        "Мотузенко М.С.",
        "Бондар О.С.",
        "Кулик Д.І."
    ];

    const statusTypes = {
        "duty": "Добове чергування",
        "work": "Відпрацювання (Пт/Сб)",
        "vacation": "Відпустка",
        "trip": "Відрядження",
        "sick": "Лікарняний"
    };
    
    let currentDate = new Date();
    let schedule = JSON.parse(localStorage.getItem('duty_schedule_v2')) || {};
    let activeBrushEmployee = ""; // Поточний обраний працівник для швидкого заповнення

    const monthsUA = [
        "Січень", "Лютий", "Березень", "Квітень", "Травень", "Червень",
        "Липень", "Серпень", "Вересень", "Жовтень", "Листопад", "Грудень"
    ];

    // Ініціалізація кнопок палітри швидкого заповнення
    function initBrushPanel() {
        const container = document.getElementById('brushContainer');
        container.innerHTML = employees.map(emp => `
            <button class="brush-badge" data-brush-name="${emp}" onclick="selectBrush('${emp}')">${emp}</button>
        `).join('');
    }

    function selectBrush(empName) {
        activeBrushEmployee = empName;
        document.querySelectorAll('.brush-badge').forEach(btn => btn.classList.remove('active'));
        
        if(empName) {
            document.querySelector(`[data-brush-name="${empName}"]`).classList.add('active');
        } else {
            document.getElementById('btnBrushNone').classList.add('active');
        }
    }

    // Допоміжна функція для отримання дати у форматі YYYY-MM-DD
    function getDateString(year, month, day) {
        return `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    }

    // Перевірка, чи вільний співробітник від заборон (доба через добу, лікарняні/відпустки)
    function getEmployeeValidationStatus(empName, dateStr) {
        const [y, m, d] = dateStr.split('-').map(Number);
        
        // 1. Перевірка на відпустку / лікарняний / відрядження на ЦЮ САМУ ДАТУ
        if (schedule[dateStr] && schedule[dateStr].emp === empName) {
            if (["vacation", "trip", "sick"].includes(schedule[dateStr].type)) return "allowed"; // Якщо це його поточний легітимний статус відсутності
        }

        // 2. Перевірка сусідніх днів (вчора і завтра) на наявність добового чергування
        const yesterdayObj = new Date(y, m - 1, d - 1);
        const tomorrowObj = new Date(y, m - 1, d + 1);
        
        const yesterdayStr = getDateString(yesterdayObj.getFullYear(), yesterdayObj.getMonth(), yesterdayObj.getDate());
        const tomorrowStr = getDateString(tomorrowObj.getFullYear(), tomorrowObj.getMonth(), tomorrowObj.getDate());

        if (schedule[yesterdayStr] && schedule[yesterdayStr].emp === empName && schedule[yesterdayStr].type === "duty") {
            return "block-consecutive";
        }
        if (schedule[tomorrowStr] && schedule[tomorrowStr].emp === empName && schedule[tomorrowStr].type === "duty") {
            return "block-consecutive";
        }

        // 3. Перевірка чи на цей день у нього вже є десь статус непрацездатності (якщо ми викликаємо перевірку з іншого контексту)
        if (schedule[dateStr] && schedule[dateStr].emp === empName && ["vacation", "trip", "sick"].includes(schedule[dateStr].type)) {
            return "block-absence";
        }

        return "allowed";
    }

    function initCalendar() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        
        document.getElementById('monthTitle').innerText = `${monthsUA[month]} ${year}`;
        
        const firstDayIndex = new Date(year, month, 1).getDay();
        const adjustedFirstDay = firstDayIndex === 0 ? 6 : firstDayIndex - 1;
        const totalDays = new Date(year, month + 1, 0).getDate();
        
        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = '';

        for(let i = 0; i < adjustedFirstDay; i++) {
            const emptyCell = document.createElement('div');
            emptyCell.classList.add('calendar-day', 'empty');
            grid.appendChild(emptyCell);
        }

        for(let day = 1; day <= totalDays; day++) {
            const dayCell = document.createElement('div');
            dayCell.classList.add('calendar-day');
            
            const dateObj = new Date(year, month, day);
            const dayOfWeek = dateObj.getDay();
            const isCritical = [4, 5, 6, 0].includes(dayOfWeek);
            
            if(isCritical) {
                dayCell.classList.add('critical-day');
            }

            const dateString = getDateString(year, month, day);
            const savedDayData = schedule[dateString] || { emp: "", type: "" };

            if(savedDayData.type) {
                dayCell.classList.add(`day-${savedDayData.type}`);
            }

            // Додаємо подію кліку по клітинці для режиму "Швидкого пензлика"
            dayCell.addEventListener('click', (e) => {
                if (activeBrushEmployee && e.target.tagName !== 'SELECT') {
                    const validation = getEmployeeValidationStatus(activeBrushEmployee, dateString);
                    if (validation === "block-consecutive") {
                        alert(`❌ Помилка! ${activeBrushEmployee} не може чергувати два дні поспіль!`);
                        return;
                    }
                    
                    if (!schedule[dateString]) schedule[dateString] = { emp: "", type: "" };
                    schedule[dateString].emp = activeBrushEmployee;
                    schedule[dateString].type = "duty";
                    initCalendar();
                }
            });
            
            // Фільтруємо список працівників для кожного конкретного дня на базі правил захисту
            const availableEmployees = employees.filter(emp => {
                // Завжди показуємо того, хто вже обраний
                if (savedDayData.emp === emp) return true;
                
                // Перевіряємо правила
                const check = getEmployeeValidationStatus(emp, dateString);
                return check === "allowed";
            });

            dayCell.innerHTML = `
                <div class="day-header">
                    <div class="day-number">${day}</div>
                </div>
                <select class="employee-select" data-date="${dateString}" onchange="updateDayEmployee(this)">
                    <option value="">— Вільний —</option>
                    ${employees.map(emp => {
                        const isAvailable = availableEmployees.includes(emp);
                        if (!isAvailable && savedDayData.emp !== emp) return ''; // Приховуємо недоступних
                        return `<option value="${emp}" ${savedDayData.emp === emp ? 'selected' : ''}>${emp}</option>`;
                    }).join('')}
                </select>
                <select class="type-select" data-date="${dateString}" onchange="updateDayType(this)" ${savedDayData.emp ? '' : 'disabled'}>
                    <option value="">— Оберіть статус —</option>
                    ${Object.keys(statusTypes).map(key => `<option value="${key}" ${savedDayData.type === key ? 'selected' : ''}>${statusTypes[key]}</option>`).join('')}
                </select>
            `;
            
            grid.appendChild(dayCell);
        }

        calculateStats();
    }

    function updateDayEmployee(selectElement) {
        const date = selectElement.getAttribute('data-date');
        const empName = selectElement.value;
        const typeSelect = selectElement.nextElementSibling;

        if (empName) {
            const validation = getEmployeeValidationStatus(empName, date);
            if (validation === "block-consecutive") {
                alert(`❌ Помилка! Цей працівник не може заступати дві доби поспіль.`);
                selectElement.value = "";
                return;
            }

            if (!schedule[date]) schedule[date] = { emp: "", type: "" };
            schedule[date].emp = empName;
            if (!schedule[date].type) schedule[date].type = "duty"; 
            typeSelect.disabled = false;
        } else {
            delete schedule[date];
            typeSelect.disabled = true;
            typeSelect.value = "";
        }
        
        initCalendar();
    }

    function updateDayType(selectElement) {
        const date = selectElement.getAttribute('data-date');
        const statusType = selectElement.value;

        if (schedule[date] && statusType) {
            schedule[date].type = statusType;
        } else if (schedule[date]) {
            schedule[date].type = "duty";
        }
        
        initCalendar();
    }

    function calculateStats() {
        const stats = {};
        employees.forEach(emp => {
            stats[emp] = { duty: 0, critical: 0, work: 0, other: 0 };
        });

        Object.keys(schedule).forEach(dateStr => {
            const dayData = schedule[dateStr];
            const empName = dayData.emp;
            const type = dayData.type;

            if(stats[empName]) {
                if (type === "duty") {
                    stats[empName].duty += 1;
                    const [y, m, d] = dateStr.split('-').map(Number);
                    const dayOfWeek = new Date(y, m - 1, d).getDay();
                    if([4, 5, 6, 0].includes(dayOfWeek)) {
                        stats[empName].critical += 1;
                    }
                } else if (type === "work") {
                    stats[empName].work += 1;
                } else if (["vacation", "trip", "sick"].includes(type)) {
                    stats[empName].other += 1;
                }
            }
        });

        const sortedEmployees = [...employees].sort((a, b) => (stats[b].duty + stats[b].work) - (stats[a].duty + stats[a].work));

        const statsList = document.getElementById('statsList');
        statsList.innerHTML = sortedEmployees.map(emp => {
            const totalDuties = stats[emp].duty;
            
            // Логіка визначення кольору індикатора навантаження
            let loadClass = "load-low";
            if (totalDuties >= 4 && totalDuties <= 6) loadClass = "load-medium";
            if (totalDuties >= 7) loadClass = "load-high";

            return `
                <div class="stat-card">
                    <div class="load-indicator ${loadClass}"></div>
                    <div class="stat-name" title="${emp}">${emp}</div>
                    <div class="badge badge-total">${stats[emp].duty}</div>
                    <div class="badge badge-critical">${stats[emp].critical}</div>
                    <div class="badge badge-work">${stats[emp].work}</div>
                    <div class="badge badge-other">${stats[emp].other}</div>
                </div>
            `;
        }).join('');
    }

    function changeMonth(direction) {
        currentDate.setMonth(currentDate.getMonth() + direction);
        initCalendar();
    }

    function saveToCloudAndLocal() {
        localStorage.setItem('duty_schedule_v2', JSON.stringify(schedule));
        
        const saveBtn = document.querySelector('.btn[style*="var(--success)"]');
        const originalText = saveBtn.innerText;
        saveBtn.innerText = "Зберігаємо...";
        saveBtn.style.opacity = "0.6";
        saveBtn.disabled = true;

        fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors", 
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(schedule)
        })
        .then(() => {
            alert('📊 Чудово! Графік оновлено, захист перевірив дані, усе збережено в Google Таблицю!');
        })
        .catch(err => {
            console.error("Помилка:", err);
            alert('Збережено локально в браузері. Перевірте з’єднання.');
        })
        .finally(() => {
            saveBtn.innerText = originalText;
            saveBtn.style.opacity = "1";
            saveBtn.disabled = false;
        });
    }

    // Стартові виклики
    initBrushPanel();
    selectBrush(''); // За замовчуванням пензлик вимкнений
    initCalendar();
</script>
</body>
</html>
