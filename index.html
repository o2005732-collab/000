<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DutyControl Pro — Система Чергувань</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --panel-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-primary: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.15);
            --critical-day: #f43f5e;
            --critical-glow: rgba(244, 63, 94, 0.25);
            --success: #10b981;
            
            /* Нові кольори для статусів */
            --status-work: rgba(16, 185, 129, 0.15);
            --status-vacation: rgba(56, 189, 248, 0.15);
            --status-trip: rgba(168, 85, 247, 0.15);
            --status-sick: rgba(f5, 158, 11, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1700px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 480px;
            gap: 2rem;
        }

        @media (max-width: 1300px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            padding: 1.5rem 2rem;
            border-radius: 24px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
        }

        .logo-area h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #fff, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-area span {
            color: var(--accent-primary);
        }

        .month-selector {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.6rem 1.2rem;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: var(--accent-primary);
            box-shadow: 0 0 15px var(--accent-glow);
            border-color: transparent;
        }

        .current-month-title {
            font-size: 1.2rem;
            font-weight: 600;
            min-width: 150px;
            text-align: center;
        }

        /* КАЛЕНДАР */
        .main-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .weekdays-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            text-align: center;
            margin-bottom: 1rem;
        }

        .weekday-label {
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
            padding: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 12px;
        }

        .calendar-day {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            min-height: 140px;
            padding: 0.8rem;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .calendar-day:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .calendar-day.empty {
            background: transparent;
            border: none;
            pointer-events: none;
        }

        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .day-number {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        /* Підсвічування Чт, Пт, Сб, Нд за замовчуванням */
        .calendar-day.critical-day {
            background: rgba(244, 63, 94, 0.02);
            border-color: rgba(244, 63, 94, 0.15);
        }
        
        .calendar-day.critical-day .day-number {
            color: var(--critical-day);
        }

        /* Стилі для підсвітки різних статусів в календарі */
        .day-duty { border-color: rgba(99, 102, 241, 0.4); background: rgba(99, 102, 241, 0.05) !important; }
        .day-work { border-color: rgba(16, 185, 129, 0.4); background: rgba(16, 185, 129, 0.05) !important; }
        .day-vacation { border-color: rgba(56, 189, 248, 0.4); background: rgba(56, 189, 248, 0.05) !important; }
        .day-trip { border-color: rgba(168, 85, 247, 0.4); background: rgba(168, 85, 247, 0.05) !important; }
        .day-sick { border-color: rgba(245, 158, 11, 0.4); background: rgba(245, 158, 11, 0.05) !important; }

        .employee-select, .type-select {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.4rem;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
            outline: none;
            transition: all 0.3s ease;
        }

        .employee-select:focus, .type-select:focus {
            border-color: var(--accent-primary);
        }

        .employee-select option, .type-select option {
            background: #1e293b;
            color: var(--text-main);
        }

        /* СИДБАР / АНАЛІТИКА */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .stats-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 1.5rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .stats-panel h2 {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
        }

        .stats-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            max-height: 650px;
            overflow-y: auto;
            padding-right: 0.25rem;
        }

        .stats-list::-webkit-scrollbar {
            width: 4px;
        }
        .stats-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 0.85rem;
            display: grid;
            grid-template-columns: 140px repeat(4, 1fr);
            gap: 0.5rem;
            align-items: center;
        }

        .stat-name {
            font-weight: 500;
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge {
            padding: 0.35rem 0.2rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            text-align: center;
        }

        .badge-total { background: rgba(99, 102, 241, 0.12); color: #a5b4fc; border: 1px solid rgba(99, 102, 241, 0.25); }
        .badge-critical { background: rgba(244, 63, 94, 0.12); color: #fca5a5; border: 1px solid rgba(244, 63, 94, 0.25); }
        .badge-work { background: rgba(16, 185, 129, 0.12); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.25); }
        .badge-other { background: rgba(148, 163, 184, 0.12); color: #cbd5e1; border: 1px solid rgba(148, 163, 184, 0.25); }

        .sync-banner {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2) 0%, rgba(16, 185, 129, 0.1) 100%);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 16px;
            padding: 1rem;
            font-size: 0.85rem;
            line-height: 1.4;
            color: #cbd5e1;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo-area">
            <h1>DutyControl <span>Pro</span></h1>
        </div>
        <div class="month-selector">
            <button class="btn" onclick="changeMonth(-1)">◀</button>
            <div class="current-month-title" id="monthTitle">Липень 2026</div>
            <button class="btn" onclick="changeMonth(1)">▶</button>
        </div>
        <div>
            <button class="btn" style="border-color: var(--success); color: var(--success);" onclick="saveToCloudAndLocal()">Зберегти зміни</button>
        </div>
    </header>

    <main class="main-panel">
        <div class="weekdays-grid">
            <div class="weekday-label">Пн</div>
            <div class="weekday-label">Вт</div>
            <div class="weekday-label">Ср</div>
            <div class="weekday-label">Чт</div>
            <div class="weekday-label">Пт</div>
            <div class="weekday-label">Сб</div>
            <div class="weekday-label">Нд</div>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
    </main>

    <aside class="sidebar">
        <div class="stats-panel">
            <h2>Аналітика нарядів та статусів</h2>
            <div style="display: grid; grid-template-columns: 140px repeat(4, 1fr); gap: 0.5rem; padding: 0 0.5rem 0.5rem 0.5rem; color: var(--text-muted); font-size: 0.65rem; font-weight: bold; text-align: center; text-transform: uppercase;">
                <span style="text-align: left;">Працівник</span>
                <span>Черг.</span>
                <span>Чт-Нд</span>
                <span>Відпр.</span>
                <span>Інше</span>
            </div>
            <div class="stats-list" id="statsList"></div>
        </div>

        <div class="sync-banner">
            <strong>📋 Легенда статусів «Інше»:</strong><br>
            В колонці «Інше» підсумовуються дні, коли працівник перебував у відпустці, відрядженні або на лікарняному.
        </div>
    </aside>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzhu3m5MazbR5CY6KkgqCRlpxTaVih_RIaystRhpTOIRPbsqJQk8cw6ARNiSub3T2xB/exec";

    // 13 Працівників
    const employees = [
        "Дем'яненко Т.І.",
        "Цибко В.І.",
        "Ївженко В.О.",
        "Щербатюк М.В.",
        "Магера В.В.",
        "Муха М.О.",
        "Дробіт О.Ю.",
        "Онищенко Р.В.",
        "Романов В.М.",
        "Магера А.В.",
        "Мотузенко М.С.",
        "Бондар О.С.",
        "Кулик Д.І."
    ];

    // Типи подій / статусів дня
    const statusTypes = {
        "duty": "Добове чергування",
        "work": "Відпрацювання (Пт/Сб)",
        "vacation": "Відпустка",
        "trip": "Відрядження",
        "sick": "Лікарняний"
    };
    
    let currentDate = new Date();
    
    // Структура збереження стала складнішою: { "YYYY-MM-DD": { emp: "Ім'я", type: "duty" } }
    let schedule = JSON.parse(localStorage.getItem('duty_schedule_v2')) || {};

    const monthsUA = [
        "Січень", "Лютий", "Березень", "Квітень", "Травень", "Червень",
        "Липень", "Серпень", "Вересень", "Жочень", "Листопад", "Грудень"
    ];

    function initCalendar() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        
        document.getElementById('monthTitle').innerText = `${monthsUA[month]} ${year}`;
        
        const firstDayIndex = new Date(year, month, 1).getDay();
        const adjustedFirstDay = firstDayIndex === 0 ? 6 : firstDayIndex - 1;
        const totalDays = new Date(year, month + 1, 0).getDate();
        
        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = '';

        for(let i = 0; i < adjustedFirstDay; i++) {
            const emptyCell = document.createElement('div');
            emptyCell.classList.add('calendar-day', 'empty');
            grid.appendChild(emptyCell);
        }

        for(let day = 1; day <= totalDays; day++) {
            const dayCell = document.createElement('div');
            dayCell.classList.add('calendar-day');
            
            const dateObj = new Date(year, month, day);
            const dayOfWeek = dateObj.getDay();
            const isCritical = [4, 5, 6, 0].includes(dayOfWeek);
            
            if(isCritical) {
                dayCell.classList.add('critical-day');
            }

            const dateString = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
            const savedDayData = schedule[dateString] || { emp: "", type: "" };

            // Додаємо клас стилю відповідно до типу події
            if(savedDayData.type) {
                dayCell.classList.add(`day-${savedDayData.type}`);
            }
            
            dayCell.innerHTML = `
                <div class="day-header">
                    <div class="day-number">${day}</div>
                </div>
                <select class="employee-select" data-date="${dateString}" onchange="updateDayEmployee(this)">
                    <option value="">— Вільний —</option>
                    ${employees.map(emp => `<option value="${emp}" ${savedDayData.emp === emp ? 'selected' : ''}>${emp}</option>`).join('')}
                </select>
                <select class="type-select" data-date="${dateString}" onchange="updateDayType(this)" ${savedDayData.emp ? '' : 'disabled'}>
                    <option value="">— Оберіть статус —</option>
                    ${Object.keys(statusTypes).map(key => `<option value="${key}" ${savedDayData.type === key ? 'selected' : ''}>${statusTypes[key]}</option>`).join('')}
                </select>
            `;
            
            grid.appendChild(dayCell);
        }

        calculateStats();
    }

    function updateDayEmployee(selectElement) {
        const date = selectElement.getAttribute('data-date');
        const empName = selectElement.value;
        const typeSelect = selectElement.nextElementSibling;

        if (empName) {
            if (!schedule[date]) schedule[date] = { emp: "", type: "" };
            schedule[date].emp = empName;
            // Якщо тип не обрано, за замовчуванням ставимо добове чергування
            if (!schedule[date].type) schedule[date].type = "duty"; 
            typeSelect.disabled = false;
        } else {
            delete schedule[date];
            typeSelect.disabled = true;
            typeSelect.value = "";
        }
        
        initCalendar(); // Перерендеримо для зміни кольорів карток
    }

    function updateDayType(selectElement) {
        const date = selectElement.getAttribute('data-date');
        const statusType = selectElement.value;

        if (schedule[date] && statusType) {
            schedule[date].type = statusType;
        } else if (schedule[date]) {
            schedule[date].type = "duty"; // Фолбек
        }
        
        initCalendar();
    }

    function calculateStats() {
        const stats = {};
        employees.forEach(emp => {
            stats[emp] = { duty: 0, critical: 0, work: 0, other: 0 };
        });

        Object.keys(schedule).forEach(dateStr => {
            const dayData = schedule[dateStr];
            const empName = dayData.emp;
            const type = dayData.type;

            if(stats[empName]) {
                if (type === "duty") {
                    stats[empName].duty += 1;
                    // Рахуємо критичні дні лише для повноцінних добових чергувань
                    const [y, m, d] = dateStr.split('-').map(Number);
                    const dayOfWeek = new Date(y, m - 1, d).getDay();
                    if([4, 5, 6, 0].includes(dayOfWeek)) {
                        stats[empName].critical += 1;
                    }
                } else if (type === "work") {
                    stats[empName].work += 1;
                } else if (["vacation", "trip", "sick"].includes(type)) {
                    stats[empName].other += 1;
                }
            }
        });

        // Сортуємо по сумі чергувань та відпрацювань
        const sortedEmployees = [...employees].sort((a, b) => (stats[b].duty + stats[b].work) - (stats[a].duty + stats[a].work));

        const statsList = document.getElementById('statsList');
        statsList.innerHTML = sortedEmployees.map(emp => `
            <div class="stat-card">
                <div class="stat-name" title="${emp}">${emp}</div>
                <div class="badge badge-total">${stats[emp].duty}</div>
                <div class="badge badge-critical">${stats[emp].critical}</div>
                <div class="badge badge-work">${stats[emp].work}</div>
                <div class="badge badge-other">${stats[emp].other}</div>
            </div>
        `).join('');
    }

    function changeMonth(direction) {
        currentDate.setMonth(currentDate.getMonth() + direction);
        initCalendar();
    }

    function saveToCloudAndLocal() {
        localStorage.setItem('duty_schedule_v2', JSON.stringify(schedule));
        
        const saveBtn = document.querySelector('.btn[style*="var(--success)"]');
        const originalText = saveBtn.innerText;
        saveBtn.innerText = "Зберігаємо...";
        saveBtn.style.opacity = "0.6";
        saveBtn.disabled = true;

        fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors", 
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(schedule)
        })
        .then(() => {
            alert('📊 Нова версія графіку синхронізована з Google!');
        })
        .catch(err => {
            console.error("Помилка:", err);
            alert('Збережено локально. Проблема зі зв’язком.');
        })
        .finally(() => {
            saveBtn.innerText = originalText;
            saveBtn.style.opacity = "1";
            saveBtn.disabled = false;
        });
    }

    initCalendar();
</script>
</body>
</html>
